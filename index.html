<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffd6e7" />
  <title>Tabletke 🌸</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
</head>
<body>
  <!-- SVG illustrations: flowers, hearts, bows, sparkles -->
  <svg class="sticker sticker-flower-1" viewBox="0 0 100 100" aria-hidden="true">
    <g>
      <circle cx="50" cy="22" r="16" fill="#ffb8d4"/>
      <circle cx="78" cy="50" r="16" fill="#ffb8d4"/>
      <circle cx="50" cy="78" r="16" fill="#ffb8d4"/>
      <circle cx="22" cy="50" r="16" fill="#ffb8d4"/>
      <circle cx="50" cy="50" r="14" fill="#fff3a8"/>
      <circle cx="46" cy="47" r="3" fill="#e84a89"/>
    </g>
  </svg>

  <svg class="sticker sticker-flower-2" viewBox="0 0 100 100" aria-hidden="true">
    <g>
      <ellipse cx="50" cy="20" rx="12" ry="18" fill="#ffd6e7"/>
      <ellipse cx="80" cy="50" rx="18" ry="12" fill="#ffd6e7"/>
      <ellipse cx="50" cy="80" rx="12" ry="18" fill="#ffd6e7"/>
      <ellipse cx="20" cy="50" rx="18" ry="12" fill="#ffd6e7"/>
      <ellipse cx="70" cy="30" rx="14" ry="12" fill="#ffe6f0" transform="rotate(45 70 30)"/>
      <ellipse cx="70" cy="70" rx="14" ry="12" fill="#ffe6f0" transform="rotate(-45 70 70)"/>
      <ellipse cx="30" cy="70" rx="14" ry="12" fill="#ffe6f0" transform="rotate(45 30 70)"/>
      <ellipse cx="30" cy="30" rx="14" ry="12" fill="#ffe6f0" transform="rotate(-45 30 30)"/>
      <circle cx="50" cy="50" r="13" fill="#ffeb99"/>
      <circle cx="50" cy="50" r="8" fill="#ffd24a"/>
    </g>
  </svg>

  <svg class="sticker sticker-heart-1" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 85 C 20 65, 10 40, 25 25 C 38 12, 50 22, 50 35 C 50 22, 62 12, 75 25 C 90 40, 80 65, 50 85 Z"
          fill="#ff6ba1" stroke="#e84a89" stroke-width="2"/>
    <ellipse cx="38" cy="38" rx="6" ry="4" fill="#ffd6e7" opacity="0.7"/>
  </svg>

  <svg class="sticker sticker-heart-2" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 85 C 20 65, 10 40, 25 25 C 38 12, 50 22, 50 35 C 50 22, 62 12, 75 25 C 90 40, 80 65, 50 85 Z"
          fill="#ffb8d4" stroke="#ff8fb8" stroke-width="2"/>
    <ellipse cx="38" cy="38" rx="6" ry="4" fill="#ffeaf3" opacity="0.8"/>
  </svg>

  <svg class="sticker sticker-bow" viewBox="0 0 120 80" aria-hidden="true">
    <path d="M60 40 L20 15 L15 40 L20 65 Z" fill="#ff8fb8" stroke="#e84a89" stroke-width="2"/>
    <path d="M60 40 L100 15 L105 40 L100 65 Z" fill="#ff8fb8" stroke="#e84a89" stroke-width="2"/>
    <ellipse cx="60" cy="40" rx="10" ry="12" fill="#ff6ba1" stroke="#e84a89" stroke-width="2"/>
    <path d="M25 25 Q 30 35 25 50" stroke="#ffd6e7" stroke-width="2" fill="none"/>
    <path d="M95 25 Q 90 35 95 50" stroke="#ffd6e7" stroke-width="2" fill="none"/>
  </svg>

  <svg class="sticker sticker-sparkle-1" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 5 L57 43 L95 50 L57 57 L50 95 L43 57 L5 50 L43 43 Z" fill="#fff3a8" stroke="#ffd24a" stroke-width="2"/>
    <circle cx="50" cy="50" r="6" fill="#fff"/>
  </svg>

  <svg class="sticker sticker-sparkle-2" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 10 L55 45 L90 50 L55 55 L50 90 L45 55 L10 50 L45 45 Z" fill="#ffeaf3" stroke="#ff8fb8" stroke-width="2"/>
    <circle cx="50" cy="50" r="5" fill="#fff"/>
  </svg>

  <svg class="sticker sticker-cloud" viewBox="0 0 140 80" aria-hidden="true">
    <ellipse cx="40" cy="50" rx="28" ry="22" fill="#ffffff" stroke="#ffd6e7" stroke-width="2"/>
    <ellipse cx="75" cy="40" rx="32" ry="28" fill="#ffffff" stroke="#ffd6e7" stroke-width="2"/>
    <ellipse cx="105" cy="52" rx="26" ry="20" fill="#ffffff" stroke="#ffd6e7" stroke-width="2"/>
    <circle cx="60" cy="48" r="3" fill="#ff8fb8"/>
    <circle cx="85" cy="48" r="3" fill="#ff8fb8"/>
    <path d="M65 58 Q 72 64 80 58" stroke="#ff8fb8" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>

  <svg class="sticker sticker-strawberry" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 90 C 20 90, 15 55, 25 40 C 35 30, 65 30, 75 40 C 85 55, 80 90, 50 90 Z" fill="#ff6ba1" stroke="#e84a89" stroke-width="2"/>
    <path d="M25 40 L35 25 L45 35 L50 22 L55 35 L65 25 L75 40 Z" fill="#7fc774" stroke="#4f9a47" stroke-width="2"/>
    <circle cx="40" cy="55" r="2" fill="#fff3a8"/>
    <circle cx="55" cy="60" r="2" fill="#fff3a8"/>
    <circle cx="48" cy="72" r="2" fill="#fff3a8"/>
    <circle cx="35" cy="70" r="2" fill="#fff3a8"/>
    <circle cx="62" cy="72" r="2" fill="#fff3a8"/>
  </svg>

  <main class="app">
    <header class="header">
      <h1>Tablete <span class="emoji-pop">💊</span></h1>
      <p class="subtitle">Ne pozabi, Eli 🌷</p>
    </header>

    <section class="today-card">
      <div class="polaroid polaroid-1">
        <img src="image0.jpeg" alt="Gin" />
        <span class="polaroid-caption">Gin ❤ </span>
      </div>
      <div class="polaroid polaroid-2">
        <img src="image1.jpeg" alt="muca spi" />
        <span class="polaroid-caption">spi ✨</span>
      </div>
      <div class="polaroid polaroid-3">
        <img src="image2.jpeg" alt="muca" />
        <span class="polaroid-caption">love 🌷</span>
      </div>

      <div class="today-label">Danes je</div>
      <div class="today-date" id="today-date">—</div>

      <div class="today-status" id="today-status">
        <div class="status-photo" id="status-photo">
          <img src="IMG_4663.jpeg" alt="Eli" class="photo-pending" />
          <img src="F399F740-308F-4D36-8BF5-FB70316E574A.JPG" alt="thumbs up" class="photo-done" />
          <span class="status-photo-badge" id="status-badge">💖</span>
        </div>
        <div class="status-text" id="status-text">Si že vzela?</div>
      </div>

      <div class="today-actions">
        <button class="btn btn-primary" id="btn-taken" aria-label="Označi tableto">
          <span id="btn-taken-label">✓</span>
        </button>
      </div>
    </section>


    <section class="calendar-section">
      <div class="calendar-header">
        <button class="nav-btn" id="prev-month" aria-label="Prejšnji mesec">‹</button>
        <h2 id="month-title">—</h2>
        <button class="nav-btn" id="next-month" aria-label="Naslednji mesec">›</button>
      </div>
      <div class="weekdays">
        <div>Po</div><div>To</div><div>Sr</div><div>Če</div><div>Pe</div><div>So</div><div>Ne</div>
      </div>
      <div class="calendar-grid" id="calendar"></div>
      <div class="legend">
        <span><span class="dot taken"></span> Vzela</span>
        <span><span class="dot today-dot"></span> Danes</span>
      </div>
    </section>


  </main>

  <script src="app.js"></script>
</body>
</html>
